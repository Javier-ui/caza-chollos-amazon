name: barrido-amazon-ue

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Ejecutar ciclo prudente
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT_ID: '-1003980825772'
          MIN_DISCOUNT: '25'
          CATEGORY_DELAY_SECONDS: '10'
          MAX_RETRIES_503: '3'
        run: python3 bot.py --once
      - name: Persistir deduplicación
        run: |
          git config user.name 'caza-chollos-bot'
          git config user.email 'caza-chollos-bot@users.noreply.github.com'
          git add -f data.json
          git diff --cached --quiet || (git commit -m 'Actualizar estado del escáner' && git push)
